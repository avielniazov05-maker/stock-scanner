name: daily-scan
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = אחרי סגירה (16:00 ET) גם בשעון חורף וגם בקיץ
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m scanner.run_scan
        env:
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: שמירת תוצאות והיסטוריית התראות (מסד SQLite) ב-repo
        run: |
          git config user.name "scanner-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/results.json data/alerts.db 2>/dev/null || git add docs/data/results.json
          git diff --staged --quiet || (git commit -m "scan $(date -u +%F)" && git push)
