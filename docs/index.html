<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>סורק תמיכות</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#f6f7f9;color:#1c2330}
header{background:#1c2330;color:#fff;padding:12px 20px}
#banner{background:#c0392b;color:#fff;padding:10px 20px;font-weight:700;display:none}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px}
nav button{border:1px solid #c9ced6;background:#fff;padding:7px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:#2557d6;color:#fff;border-color:#2557d6}
main{padding:0 20px 30px}table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid #e4e7ec;text-align:right;font-size:14px}
tr.row{cursor:pointer}tr.row:hover{background:#eef3ff}
.bonus{background:#f1c40f;color:#222;border-radius:4px;padding:1px 6px;font-size:12px;margin-inline-start:4px}
.empty{padding:24px;background:#fff;border:1px dashed #c9ced6;border-radius:8px}
canvas{background:#fff;width:100%;max-width:820px;height:300px;direction:ltr}
.meta{color:#667;font-size:13px;padding:0 20px}
tr.row.sel{background:#dbe6ff}
#pop{display:none;position:fixed;top:70px;left:16px;width:min(720px,94vw);background:#fff;border:1px solid #9aa3b2;border-radius:10px;box-shadow:0 8px 30px #0004;z-index:10;padding:10px;direction:rtl}
#pop img{width:100%;direction:ltr;display:block}
#pop .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#pop button{border:0;background:#eee;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:16px}
#pop .pb{background:#f1c40f33;padding:3px 8px;border-radius:5px;font-size:13px;margin-bottom:6px}
#pop .pf{font-size:13px;color:#445;margin-top:6px}
</style></head><body>
<header><b>סורק תמיכות – מניות אמריקאיות</b></header>
<div id="banner"></div><div class="meta" id="meta"></div><nav id="tabs"></nav><main id="main"></main>
<div id="pop"></div>
<script>
let D, cur;
const fmt=(x,d=2)=>Number(x).toFixed(d);
fetch('data/results.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;
 const m=d.meta; if(m.is_sample){const b=document.getElementById('banner');b.style.display='block';
  b.textContent='⚠ נתוני דוגמה סינתטיים בלבד – לא נתוני שוק אמיתיים. הטיקרים בדויים.';}
 document.getElementById('meta').textContent=`${m.mode==='open'?'סריקת פתיחה (נר חלקי, ללא פטיש)':'סריקת סגירה'} · נתונים עד ${m.as_of} · ספק: ${m.provider} · ביקום ${m.universe} מניות, עברו פילטר: ${m.passed_filter}`;
 const t=document.getElementById('tabs');
 Object.keys(d.labels).forEach(k=>{const b=document.createElement('button');
  b.textContent=`${d.labels[k]} (${d.stages[k].length})`;b.onclick=()=>show(k);b.dataset.k=k;t.appendChild(b)});
 show(Object.keys(d.labels)[0]);});
function show(k){cur=k;closePop();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 const rows=D.stages[k],M=document.getElementById('main');
 if(!rows.length){M.innerHTML='<div class="empty">אין מניות שעוברות את השלב הזה בסריקה האחרונה.</div>';return}
 M.innerHTML='<table><tr><th>מניה</th><th>מחיר</th><th>תמיכה (חישוב הסורק)</th><th>מרחק %</th><th>נגיעות</th><th>קישורים</th></tr>'+
 rows.map((r,i)=>`<tr class="row" onclick="chartRow(${i})"><td><b>${r.ticker}</b>${r.bonus.map(b=>`<span class="bonus" title="${b}">בונוס</span>`).join('')}${r.kind?` (${r.kind==='double'?'כפולה':'משולשת'})`:''}</td>
 <td>${fmt(r.price)}</td><td>${fmt(r.support)}</td><td dir="ltr" style="text-align:right">${fmt(r.distance_pct)}%</td><td>${r.touches??'-'}</td>
 <td><a href="${r.finviz}" target="_blank" onclick="event.stopPropagation()">Finviz</a> · <a href="${r.tradingview}" target="_blank" onclick="event.stopPropagation()">TradingView</a></td></tr>`).join('')+'</table>'}
function chartRow(i){
 const r=D.stages[cur][i];
 document.querySelectorAll('tr.row.sel').forEach(x=>x.classList.remove('sel'));
 document.querySelectorAll('tr.row')[i].classList.add('sel');
 const p=document.getElementById('pop');p.style.display='block';        // חלון יחיד: פתיחה חדשה מחליפה את הקודם
 p.innerHTML=`<div class="ph"><b>${r.ticker}</b> · ${r.name} <button onclick="closePop()" title="סגור">✕</button></div>
  ${r.bonus.length?`<div class="pb">בונוס – עובר גם: ${r.bonus.join(', ')}</div>`:''}
  <img alt="${r.ticker} – גרף Finviz" src="https://charts2.finviz.com/chart.ashx?t=${r.ticker}&ty=c&ta=0&p=d&s=l">
  <div class="pf">מחיר ${fmt(r.price)} · תמיכה ${fmt(r.support)} · מרחק ${fmt(r.distance_pct)}% · נגיעות ${r.touches??'-'}<br>
  הגרף של Finviz עצמו. לא נטען? <a href="${r.finviz}" target="_blank">פתח ב-Finviz</a> · <a href="${r.tradingview}" target="_blank">TradingView</a></div>`}
function closePop(){document.getElementById('pop').style.display='none';
 document.querySelectorAll('tr.row.sel').forEach(x=>x.classList.remove('sel'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
function draw(cv,c){const g=cv.getContext('2d'),W=cv.width,H=cv.height,n=c.candles.length;
 const all=c.candles.flatMap(x=>[x[1],x[2]]).concat(c.lines.flatMap(l=>[l[1],l[3]]));
 const lo=Math.min(...all),hi=Math.max(...all),y=v=>H-20-(v-lo)/(hi-lo||1)*(H-40),x=i=>20+i*(W-40)/n,w=(W-40)/n*.7;
 g.clearRect(0,0,W,H);
 c.candles.forEach((k,i)=>{const [o,h,l,cl]=k;g.strokeStyle=g.fillStyle=cl>=o?'#1a9850':'#d73027';
  g.beginPath();g.moveTo(x(i)+w/2,y(h));g.lineTo(x(i)+w/2,y(l));g.stroke();
  g.fillRect(x(i),Math.min(y(o),y(cl)),w,Math.max(2,Math.abs(y(o)-y(cl))))});
 g.strokeStyle='#2557d6';g.lineWidth=3;c.lines.forEach(l=>{g.beginPath();g.moveTo(x(l[0])+w/2,y(l[1]));g.lineTo(x(l[2])+w/2,y(l[3]));g.stroke()});
 g.fillStyle='#333';g.font='22px sans-serif';g.fillText(fmt(hi),4,18);g.fillText(fmt(lo),4,H-4);
 g.fillText(c.dates[0],W-170,H-4);g.fillText(c.dates[n-1],60,H-4)}
</script></body></html>
