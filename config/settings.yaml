# ===== הפילטר שלך (כפי שהוגדר) =====
filter:
  min_market_cap: 2000000000   # שווי שוק מעל 2 מיליארד $
  min_price: 10                # מחיר מעל 10$
  min_avg_volume: 500000       # נפח ממוצע מעל 500K
  common_stock_only: true      # מניות רגילות בלבד, בלי ETF

provider: yahoo_free           # sample | yahoo_free

# ===== פרמטרים שדורשים את ההחלטה שלך =====
# כל ערך כאן הוא ברירת מחדל זמנית (TBD) - לא הומצא כ"נכון". אשר או שנה.
params:
  history_days: 250            # TBD: כמה ימי מסחר אחורה לנתח
  avg_volume_days: 50          # TBD: על כמה ימים מחשבים נפח ממוצע
  pivot_window: 5              # TBD: נר הוא שפל-ציר אם הוא הנמוך ביותר ב-5 נרות לכל צד
  touch_tolerance_pct: 1.0     # TBD: "נגיעה" = הנמוך של הנר בטווח 1% מהתמיכה
  flat_slope_pct: 0.03         # TBD: שיפוע (% ליום) מתחת לערך הזה = תעלה ישרה
  min_line_touches: 3          # TBD: מינימום נגיעות בקו התחתון (כולל היום)
  min_line_span_bars: 20       # TBD: מרחק מינימלי (בנרות) בין שתי נקודות שמגדירות קו
  min_touch_gap_bars: 10       # TBD: מינימום נרות בין שתי נגיעות נפרדות
  max_touch_days: 5            # TBD: נגיעה שנמשכת יותר נרות = דשדוש על הקו, לא נגיעה
  min_channel_bars: 40         # TBD: אורך מינימלי של תעלה (מהנגיעה הראשונה עד היום)
  require_upper_line: true     # תעלה = קו תחתון + קו עליון מקביל
  min_upper_touches: 2         # TBD: מינימום שיאים על הקו העליון
  min_level_touches: 2         # TBD: מינימום שפלי-ציר שמגדירים רמת תמיכה אופקית (שלב 2)
  hammer_lower_shadow_x: 2.0   # TBD: צל תחתון >= פי 2 מהגוף
  hammer_upper_shadow_max_x: 0.5   # TBD: צל עליון <= חצי מהגוף (או פחות מ-10% מהטווח בגוף זעיר)
  max_candle_dist_pct: 0.5     # TBD: "בול על הקו" = הקו עובר דרך הנר האחרון, או שהנר עד 0.5% ממנו
  min_level_age_bars: 30       # TBD: רמה אופקית חייבת להיות בת 30 נרות לפחות (שלבים 2-4)
  confirm_mode: close_above_prev_high   # TBD: נר אישור = נר ירוק שנסגר מעל השיא של נר הנגיעה (או close_above_prev_close)
  bounce_pct: 3.0              # TBD: "עלה" = עלייה של לפחות 3% מהתמיכה בין נגיעות
  stage3_touches: [2, 3, 4]    # כפי שהוגדר
  stage4_proximity_pct: 2.0    # TBD: עד כמה המחיר צריך להיות קרוב לתמיכה כפולה/משולשת

alerts:
  cooldown_days: 5             # TBD: לא לשלוח התראה חוזרת על אותה מניה+שלב לפני X ימים
  db_path: data/alerts.db

# אופציונלי: להגביל את הסריקה לרשימת טיקרים (הסר/השאר ריק = כל השוק). לבדיקות מהירות.
# tickers: [AAPL, MSFT]

universe:                      # מטמון רשימת ה-~1400 שעוברות את הפילטר
  cache_path: data/universe.json
  refresh_days: 7              # TBD: כל כמה ימים לבנות מחדש את היקום המלא (איטי)
